<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CYBERATTACK DETECTION AI</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #38bdf8;
            --accent: #facc15;
            --dark-navy: #020617;
            --glass-bg: rgba(15, 23, 42, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(2, 6, 23, 0.75), rgba(2, 6, 23, 0.75)), 
                        url("/static/predictor.jpg") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #f8fafc;
            margin: 0;
        }

        /* --- NAVBAR --- */
        .navbar {
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent) !important;
        }

        /* --- LOGIN CARD --- */
        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            border-color: rgba(56, 189, 248, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header i {
            font-size: 3rem;
            color: var(--primary-blue);
            margin-bottom: 1rem;
        }

        .login-header h2 {
            font-weight: 700;
            font-size: 1.75rem;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* --- FORM STYLING --- */
        .input-group-text {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-color);
            color: #94a3b8;
            border-right: none;
        }

        .form-control {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.75rem 1rem;
            border-left: none;
        }

        .form-control:focus {
            background: rgba(30, 41, 59, 0.8);
            color: #fff;
            border-color: var(--primary-blue);
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .btn-login {
            background: var(--primary-blue);
            color: var(--dark-navy);
            border: none;
            padding: 0.8rem;
            font-weight: 700;
            border-radius: 12px;
            width: 100%;
            margin-top: 1rem;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2);
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .register-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* --- FOOTER --- */
        footer {
            padding: 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: #64748b;
            background: rgba(2, 6, 23, 0.9);
            border-top: 1px solid var(--border-color);
        }

        .alert {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
       <a class="navbar-brand" href="#">CYBERATTACK<span style="color:#fff">DETECTION</span></a>
    </div>
</nav>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <i class="fa-solid fa-user-lock"></i>
            <h2>Secure Access</h2>
            <p>Enter your credentials to access the console</p>
        </div>

        <form id="loginForm">
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" class="form-control" id="username" placeholder="Username" required>
            </div>

            <div class="input-group mb-4">
                <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                <input type="password" class="form-control" id="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-login">Authorize Session</button>
            <div id="loginAlert" class="alert d-none"></div>
        </form>

        <div class="register-link">
            Don't have access? <a href="/register">Request Account</a>
        </div>
    </div>
</div>

<footer>
    <div class="container">
      &copy; 2026 CYBERATTACK DETECTION MODEL | <a href="#">Security Protocol</a> |
      <a href="#">Privacy Policy</a>
    </div>
  </footer>

<script>
    const loginForm = document.getElementById('loginForm');
    const loginAlert = document.getElementById('loginAlert');

    loginForm.addEventListener('submit', async function(e){
        e.preventDefault();
        loginAlert.classList.add('d-none');
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        // Visual feedback on button
        const btn = e.target.querySelector('button');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';
        btn.disabled = true;

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const result = await res.json();

            if(result.success){
                loginAlert.classList.remove('d-none', 'alert-danger');
                loginAlert.classList.add('alert-success');
                loginAlert.style.color = '#4ade80';
                loginAlert.style.borderColor = 'rgba(74, 222, 128, 0.2)';
                loginAlert.textContent = `Access Granted. Redirecting...`;
                setTimeout(()=>{ window.location.href = '/'; }, 1200);
            } else {
                btn.innerHTML = originalText;
                btn.disabled = false;
                loginAlert.classList.remove('d-none');
                loginAlert.textContent = result.message || 'Authentication failed. Please check credentials.';
            }
        } catch(err){
            btn.innerHTML = originalText;
            btn.disabled = false;
            loginAlert.classList.remove('d-none');
            loginAlert.textContent = 'Connection error. Please try again.';
        }
    });
</script>
</body>
</html>
