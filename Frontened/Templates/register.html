<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CYBERATTACK DETECTION</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #38bdf8;
            --accent: #facc15;
            --dark-navy: #020617;
            --glass-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        html, body {
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(2, 6, 23, 0.85), rgba(2, 6, 23, 0.85)), 
                        url("/static/predictor.jpg") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            color: #f8fafc;
        }

        /* --- NAVBAR --- */
        .navbar {
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 0; /* Compact padding */
            flex-shrink: 0;
        }
        .navbar-brand {
            font-weight: 700;
            color: var(--accent) !important;
            letter-spacing: 1px;
            font-size: 1.1rem;
        }

        /* --- CONTAINER ADJUSTMENTS --- */
        .container-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .register-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 420px; /* Slimmer card */
            padding: 1.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .register-header {
            text-align: center;
            margin-bottom: 1rem;
        }

        .register-header h2 {
            font-weight: 700;
            font-size: 1.25rem;
            margin-top: 8px;
            margin-bottom: 2px;
        }

        /* --- PROFILE IMAGE --- */
        .profile-upload {
            position: relative;
            width: 70px; /* Smaller image */
            height: 70px;
            margin: 0 auto 0.5rem;
        }
        .profile-preview {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-blue);
            background: #1e293b;
        }
        .file-input-label {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary-blue);
            color: var(--dark-navy);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1.5px solid var(--dark-navy);
            font-size: 0.7rem;
        }

        /* --- FORM STYLING --- */
        .form-label-sm {
            font-size: 0.65rem;
            color: #94a3b8;
            margin-bottom: 3px;
            font-weight: 600;
            text-transform: uppercase;
            display: block;
        }

        .input-group-text {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border-color);
            color: #94a3b8;
            border-right: none;
            padding: 0.4rem 0.75rem;
        }

        .form-control {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.4rem 0.75rem;
            border-left: none;
            font-size: 0.9rem;
        }

        .mb-3 { margin-bottom: 0.75rem !important; }

        .btn-register {
            background: var(--primary-blue);
            color: var(--dark-navy);
            border: none;
            padding: 0.6rem;
            font-weight: 700;
            border-radius: 10px;
            width: 100%;
            margin-top: 0.5rem;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .btn-register:hover {
            background: #fff;
            transform: translateY(-1px);
        }

        .login-link {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .login-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        
        /* --- FOOTER --- */
        footer {
            padding: 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: #64748b;
            background: rgba(2, 6, 23, 0.9);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
       <a class="navbar-brand" href="/">CYBERATTACK<span style="color:#fff">DETECTION</span></a>
    </div>
</nav>

<main class="container-main">
    <div class="register-card">
        <div class="register-header">
            <div class="profile-upload">
                <img src="https://ui-avatars.com/api/?name=User&background=1e293b&color=38bdf8" id="imgPreview" class="profile-preview">
                <label for="profile_pic" class="file-input-label">
                    <i class="fa-solid fa-camera"></i>
                </label>
                <input type="file" id="profile_pic" hidden accept="image/*">
            </div>
            <h2>Create Specialist Account</h2>
            <p class="text-muted small mb-0">Join the advanced threat detection network</p>
        </div>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label-sm">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
                    <input type="text" class="form-control" id="fullname" placeholder="fullname" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label-sm">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="abc@gmail.com">
                </div>
            </div>

            <div class="row g-2">
                <div class="col-6 mb-3">
                    <label class="form-label-sm">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="Username" required>
                    </div>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label-sm">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="••••" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-register">Register System Access</button>
            <div id="registerAlert" class="alert d-none mt-2 py-2 small"></div>
        </form>

        <div class="login-link">
            Existing operator? <a href="/login">Secure Login</a>
        </div>
    </div>
</main>

<!-- FOOTER -->
 <footer>
    <div class="container">
      &copy; 2026 CYBERATTACK DETECTION MODEL | <a href="#">Security Protocol</a> |
      <a href="#">Privacy Policy</a>
    </div>
  </footer>

<script>
    // Logic remains functional
    document.getElementById('profile_pic').addEventListener('change', function(e) {
        if (e.target.files && e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('imgPreview').src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('registerAlert');

    form.addEventListener('submit', async function(e){
        e.preventDefault();
        const btn = form.querySelector('button');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
        btn.disabled = true;

        // Fetch logic would follow here per your original script
        setTimeout(() => {
            btn.innerHTML = 'Register System Access';
            btn.disabled = false;
        }, 2000);
    });
</script>

</body>
</html>
